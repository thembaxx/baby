<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="squircleBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171426" />
      <stop offset="52%" stop-color="#0d0b14" />
      <stop offset="100%" stop-color="#07060a" />
    </linearGradient>
    <radialGradient id="amberCoreGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d0b14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveCyan" x1="110" y1="220" x2="400" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="waveLight" x1="120" y1="260" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="goldFacetLight" x1="180" y1="130" x2="320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldFacetDark" x1="210" y1="160" x2="340" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="rimStroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Tactile Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#squircleBg)" stroke="url(#rimStroke)" stroke-width="6" />
  <circle cx="256" cy="236" r="196" fill="url(#amberCoreGlow)" />

  <!-- Outer Lunar Ring -->
  <circle cx="256" cy="256" r="168" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" />
  <circle cx="256" cy="256" r="144" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Sculpted Lunar Ocean Waves (Bottom Cradle) -->
  <path d="M96 286C136 250 196 254 256 288C316 322 376 318 416 282C398 366 332 424 256 424C180 424 114 366 96 286Z" fill="url(#waveCyan)" />
  <path d="M116 326C162 294 212 304 264 334C316 364 366 356 398 324C374 384 320 424 256 424C192 424 138 384 116 326Z" fill="url(#waveLight)" fill-opacity="0.88" />

  <!-- 3D Faceted Golden Acoustic Polyhedron Star (Center-Top) -->
  <g transform="translate(256, 212)">
    <!-- Outer Star Points -->
    <polygon points="0,-96 28,-32 0,0" fill="url(#goldFacetLight)" />
    <polygon points="0,-96 -28,-32 0,0" fill="url(#goldFacetDark)" />
    <polygon points="92,-28 32,16 0,0" fill="url(#goldFacetLight)" />
    <polygon points="92,-28 28,-32 0,0" fill="url(#goldFacetDark)" />
    <polygon points="58,78 0,38 0,0" fill="url(#goldFacetLight)" />
    <polygon points="58,78 32,16 0,0" fill="url(#goldFacetDark)" />
    <polygon points="-58,78 -32,16 0,0" fill="url(#goldFacetLight)" />
    <polygon points="-58,78 0,38 0,0" fill="url(#goldFacetDark)" />
    <polygon points="-92,-28 -28,-32 0,0" fill="url(#goldFacetLight)" />
    <polygon points="-92,-28 -32,16 0,0" fill="url(#goldFacetDark)" />
    <!-- Inner Core Gem -->
    <polygon points="0,-42 38,-12 24,32 -24,32 -38,-12" fill="#fef08a" fill-opacity="0.92" />
    <polygon points="0,-24 22,-6 14,18 -14,18 -22,-6" fill="#ffffff" />
  </g>

  <!-- Luminous Pearl Moon Accent -->
  <circle cx="348" cy="146" r="18" fill="#fafaf9" />
  <circle cx="164" cy="158" r="10" fill="#fbbf24" />
</svg>
