name: CI failure triage
on:
  workflow_run:
    workflows: ["Lightweight quality"]
    types: [completed]
permissions:
  actions: read
  issues: write
jobs:
  triage:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: thembaxx/thembaxx/.github/workflows/reusable-failure-triage.yml@17f161fa19bd548ec77133938c9775b63bd5f5db
