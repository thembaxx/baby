name: Lightweight quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: thembaxx/thembaxx/.github/workflows/reusable-light-quality.yml@17f161fa19bd548ec77133938c9775b63bd5f5db
    with:
      run_tests: false
      run_build: false
