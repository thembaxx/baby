name: One-time TypeScript compatibility repair
on:
  push:
    branches:
      - chore/deps-latest-stable-20261022
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Keep latest compatible TypeScript release for eslint-config-next
        run: |
          bun add --dev 'typescript@~6.0.3' --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts
      - name: Commit compatible dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-typescript-compat.yml
          git add package.json bun.lock
          git commit -m 'fix(deps): keep TypeScript on supported v6 for ESLint'
          git push
